name: Check entries

on:
  pull_request:
    paths:
      - "sources/**"
      - "feeds.json"
      - "picks.json"
      - "generator/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --project generator -c Release -- --strict --no-candidates --out out/catalog.json
